<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gato Gastos</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gato Gastos">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: columna móvil de 480px máx., tarjetas sobre blanco, barra de pestañas inferior y botón flotante */
:root{
  --bg:#FFFFFF; --surface:#F3F6FB; --surface-2:#E9EEF7; --line:#E1E7F1;
  --fg:#0B1830; --muted:#5D6A82; --faint:#93A0B6;
  --azul:#1E5BFF; --azul-press:#1748CC; --azul-soft:#EAF0FF;
  --celeste:#22B0F2; --celeste-2:#7FD0FA; --celeste-soft:#E5F6FE;
  --ok:#0E9468; --ok-soft:#E3F6EF; --danger:#D64545; --danger-soft:#FCEBEB;
  --shadow:0 8px 28px rgba(16,40,90,.10);
  --sheet:#FFFFFF; --backdrop:rgba(9,20,40,.35);
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08101E; --surface:#111B2D; --surface-2:#18243A; --line:#1F2C44;
  --fg:#EAF0FA; --muted:#98A5BC; --faint:#66748D;
  --azul:#5A8BFF; --azul-press:#7AA2FF; --azul-soft:#16244A;
  --celeste:#43C2F8; --celeste-2:#8FD8FB; --celeste-soft:#0F2A3C;
  --ok:#3CCB97; --ok-soft:#0F2C24; --danger:#F07272; --danger-soft:#341818;
  --shadow:0 8px 28px rgba(0,0,0,.4); --sheet:#0F1829; --backdrop:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08101E; --surface:#111B2D; --surface-2:#18243A; --line:#1F2C44;
  --fg:#EAF0FA; --muted:#98A5BC; --faint:#66748D;
  --azul:#5A8BFF; --azul-press:#7AA2FF; --azul-soft:#16244A;
  --celeste:#43C2F8; --celeste-2:#8FD8FB; --celeste-soft:#0F2A3C;
  --ok:#3CCB97; --ok-soft:#0F2C24; --danger:#F07272; --danger-soft:#341818;
  --shadow:0 8px 28px rgba(0,0,0,.4); --sheet:#0F1829; --backdrop:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--celeste);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;padding-block:8px 140px;display:flex;flex-direction:column;gap:18px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:23px;letter-spacing:-.035em;line-height:1;min-width:0}
.brand .logo{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(30,91,255,.22));margin-left:-4px}
.brand .wm{background:linear-gradient(120deg,var(--fg) 30%,var(--azul));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .dot{flex:none}
img.i3d{width:26px;height:26px;object-fit:contain;flex:none;display:block;filter:drop-shadow(0 2px 3px rgba(16,40,90,.12))}
.item .ic img.i3d{width:30px;height:30px}
.bill .ic img.i3d{width:46px;height:46px}
.cat .ic img.i3d{width:24px;height:24px}
.icons button img.i3d{width:32px;height:32px}
.vic .ic img.i3d{width:30px;height:30px}
.confirm .big-ic img.i3d{width:46px;height:46px}
.brand .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--azul),var(--celeste));display:grid;place-items:center;color:#fff}
.brand .dot svg{width:16px;height:16px;stroke-width:2.2}
.pair{display:flex;align-items:center}
.pair .av{border:2.5px solid var(--bg)}
.pair .av+.av{margin-left:-10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--azul-soft);color:var(--azul);display:grid;place-items:center;font-weight:700;font-size:14px;overflow:hidden;flex:none;padding:0;border:0}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:84px;height:84px;font-size:28px}
.av.b{background:var(--celeste-soft);color:var(--celeste)}

.banner{background:var(--celeste-soft);color:var(--fg);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner svg{color:var(--celeste)}
.banner.err{background:var(--danger-soft)}
.banner.err svg{color:var(--danger)}

h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.link{background:none;border:0;color:var(--azul);font-weight:600;font-size:14px;padding:4px 2px}

/* balance */
.bal{background:linear-gradient(150deg,var(--azul),#2F7BFF 55%,var(--celeste));color:#fff;border-radius:var(--r-lg);padding:17px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;box-shadow:var(--shadow)}
.bal .who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;opacity:.95}
.bal .who .av{border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18);color:#fff}
.bal .arrow{width:20px;height:20px;opacity:.85}
.bal-l{display:flex;flex-direction:column;gap:10px;min-width:0}
.duo{position:relative;display:flex;align-items:center;padding-bottom:14px}
.duo .av{width:80px;height:80px;font-size:26px;border:2.5px solid rgba(255,255,255,.9);background:#5E91FF;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.av img.av-gato{object-fit:contain;padding:14%;background:#fff}
.duo .av+.av{margin-left:-16px}
.duo-ic{position:absolute;bottom:-4px;left:50%;width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));z-index:2}
.duo.mano-0 .duo-ic{transform:translateX(-50%);width:46px;height:46px}
.duo.mano-der .duo-ic{transform:translateX(-58%)}
.duo.mano-izq .duo-ic{transform:translateX(-42%) scaleX(-1)}
.bal .row .btn-w,.bal .row .btn-g{padding:7px 14px;font-size:13px}
.bal .amt{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bal .sub{font-size:13.5px;opacity:.9}
.bal .row{display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1}
.btn-w{background:#fff;color:var(--azul-press);border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
:root[data-theme="dark"] .btn-w{color:#1748CC}
.btn-g{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px}

/* meta */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px}
.meta{display:grid;grid-template-columns:136px 1fr;gap:14px;align-items:stretch}
@media (max-width:360px){.meta{grid-template-columns:1fr;justify-items:center;text-align:center}.meta-info{width:100%}}
.rings{width:136px;height:136px;position:relative}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.rings .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.rings .pct{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
.rings .cc{display:flex;flex-direction:column;align-items:center;gap:1px}
.pie-casa{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(16,40,90,.16))}
.ring-t{fill:none;opacity:.16}
.ring-v{fill:none;stroke-linecap:round}
.rings.fanfarria{animation:ringPop .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes ringPop{0%{transform:scale(1)}35%{transform:scale(1.09);filter:drop-shadow(0 0 16px var(--celeste))}100%{transform:scale(1)}}
.fanfarria-capa{position:fixed;width:0;height:0;z-index:30;pointer-events:none}
.onda{position:absolute;left:-68px;top:-68px;width:136px;height:136px;box-sizing:border-box;border-radius:50%;border:4px solid var(--celeste);opacity:0;animation:onda .85s ease-out forwards}
@keyframes onda{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.chispa{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);border-radius:2px;background:var(--c);opacity:0;animation:chispa 1.15s cubic-bezier(.15,.7,.3,1) var(--t) forwards}
.chispa.r{border-radius:50%}
@keyframes chispa{0%{opacity:1;transform:rotate(var(--a)) translateX(58px) scale(.5)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) rotate(var(--g)) scale(1)}}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.3s linear infinite}
.sk.cl{background-image:linear-gradient(90deg,rgba(255,255,255,.2) 25%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.2) 75%)}
.sk.o{border-radius:50%}
.sk.aro{-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17px));mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17px))}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.skel{display:contents}
.app.listo{animation:apareceApp .35s ease-out}
@keyframes apareceApp{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sk,.app.listo{animation:none}}
.meta-info{display:flex;flex-direction:column;gap:6px;min-width:0;container-type:inline-size}
.mi-top{height:136px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mi-lbl{font-size:12.5px;font-weight:600;color:var(--muted);line-height:36px;height:36px;margin-top:-4px;padding-right:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-1{white-space:nowrap}
.mi-det{display:flex;flex-direction:column;gap:1px;font-size:12.5px;color:var(--muted);line-height:1.3}
.mi-det b{color:var(--fg);font-weight:700}
.meta-info .big{white-space:nowrap;color:var(--azul);font-size:30px;font-size:clamp(24px,19cqi,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.meta-info .of{color:var(--muted);font-size:13.5px}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px}
.ring-t1{fill:none;stroke:var(--azul);opacity:.12}
.empty img.i3d{width:54px;height:54px}
.fold{width:100%;border:0;display:flex;align-items:center;gap:10px;text-align:left;color:var(--fg);border-radius:var(--r-md);padding:10px 14px 10px 10px;background:linear-gradient(120deg,var(--celeste-soft),var(--azul-soft))}
.fold-ic{width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.fold-ic img.i3d{width:28px;height:28px}
.fold-t{flex:1;min-width:0;font-weight:800;font-size:15.5px;letter-spacing:-.01em;line-height:1.2}
.fold-t small{display:block;font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-top:2px}
.fold[aria-expanded="true"]{border-radius:var(--r-md) var(--r-md) 6px 6px}
.fold-r{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex:none}
.fold-r svg{width:18px;height:18px;color:var(--azul)}
.frow{display:grid;grid-template-columns:1.55fr 1fr;gap:10px;align-items:end}
.frow .seg button{padding:10px 4px;font-size:13.5px}
.pagobox{background:var(--surface);border-radius:var(--r-md);padding:4px 12px}
.pagobox summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;font-weight:700}
.pagobox summary::-webkit-details-marker{display:none}
.pagobox summary>svg:first-child{color:var(--azul)}
.pagobox summary span{flex:1}
.pagobox summary small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.pagobox summary>svg:last-child{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.pagobox[open] summary>svg:last-child{transform:rotate(180deg)}
.pagobox .inp{background:var(--bg)}
.pagof{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.pagov{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pagov-h{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.pagov-h svg{color:var(--azul);width:20px;height:20px}
.pagov-h b{flex:1}
.pv-row{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pv-l{font-size:11.5px;color:var(--muted);font-weight:600;grid-column:1}
.pv-v{font-weight:600;font-size:15px;grid-column:1;overflow-wrap:anywhere;color:var(--fg);text-decoration:none;user-select:all}
a.pv-v{color:var(--azul)}
.cp{grid-column:2;grid-row:1/3;align-self:center;width:38px;height:38px;border-radius:12px;border:0;background:var(--bg);color:var(--azul);display:grid;place-items:center}
.cp svg{width:18px;height:18px}
.cp.ok{background:var(--ok);color:#fff}
.pagov .btn{margin-top:8px;text-decoration:none}
.auth{max-width:420px;margin:0 auto;padding-block:40px 40px;display:flex;flex-direction:column;gap:18px}
.auth-logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.auth-logo img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(30,91,255,.25))}
.auth-logo h1{margin:4px 0 0;font-size:30px;font-weight:800;letter-spacing:-.035em}
.auth-logo p{margin:0;color:var(--muted)}
.auth-card{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.auth-card .inp{background:var(--bg)}
.auth-card .link{align-self:center}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;vertical-align:1px;margin-left:6px}
.chip.pronto{background:var(--azul-soft);color:var(--azul)}
.chip.algun{background:var(--surface-2);color:var(--muted)}
.wishbox{background:var(--surface);border-radius:var(--r-lg);padding:6px 14px 10px}
.wishbox .item{border-color:var(--line)}
.wishbox .item .ic{background:var(--bg)}
.wish-foot{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.btn.aportar{align-self:flex-end;height:40px;padding:0 18px 0 14px;font-size:15px;font-weight:800;border-radius:12px;margin-top:auto;gap:4px;background:linear-gradient(135deg,var(--azul),var(--celeste));box-shadow:0 10px 22px rgba(30,91,255,.35)}
.btn.aportar svg{width:19px;height:19px;stroke-width:2.8}
.mas{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px;z-index:3}
.mas-btn{width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);display:grid;place-items:center;box-shadow:0 2px 8px rgba(16,40,90,.08)}
.mas-btn svg{width:20px;height:20px}
.mas-menu{display:flex;gap:2px;background:var(--bg);border-radius:999px;padding:2px 6px;box-shadow:0 6px 18px rgba(16,40,90,.14);max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .28s ease,opacity .2s}
.mas.on .mas-menu{max-width:320px;opacity:1}
.mas-menu .lnk{font-size:13px;padding:6px 7px;gap:4px}
.mas-menu .lnk svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){.mas-menu{transition:none}}
.links3{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:-4px}
.lnk{background:none;border:0;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--azul);padding:6px 8px;border-radius:10px}
.lnk svg{width:17px;height:17px}
.lnk.rojo{color:var(--danger)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mbtn{background:var(--bg);border:0;border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--azul);min-width:0}
.mbtn svg{width:17px;height:17px}
.mbtn.rojo{color:var(--danger)}
.ringcol{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px}
.meta-tag{width:100%;height:40px;box-sizing:border-box;display:grid;place-items:center;text-align:center;background:transparent;border-radius:12px;padding:0 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts4 .btn{flex-direction:column;gap:3px;padding:10px 4px;border-radius:16px;font-size:12.5px;min-width:0}
.acts4 .btn svg{width:20px;height:20px}
.minis{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:-4px}
.link.sm{font-size:13px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.link.sm svg{width:16px;height:16px}
.link.sm.danger{color:var(--danger)}
.cbar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;width:100%}
.cbar i{display:block;height:100%;background:var(--celeste);border-radius:9px}
.confirm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:6px 4px}
.confirm .big-ic{width:64px;height:64px;border-radius:22px;background:var(--azul-soft);color:var(--azul);display:grid;place-items:center}
.confirm .big-ic svg{width:32px;height:32px}
.confirm h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.confirm p{margin:0;color:var(--muted);max-width:34ch}
.vic{display:flex;align-items:center;gap:12px;background:var(--celeste-soft);border-radius:var(--r-md);padding:12px 14px;border:0;width:100%;text-align:left}
.vic .ic{width:40px;height:40px;border-radius:13px;background:var(--bg);color:var(--celeste);display:grid;place-items:center;flex:none}
.vic .t{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.vic .t b{display:block;color:var(--fg);font-size:15px}
.vic .v{font-weight:800;font-size:17px}
.legend span{display:flex;align-items:center;gap:7px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600;margin-left:auto}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.btn{background:var(--azul);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--azul-press)}
.btn.soft{background:var(--azul-soft);color:var(--azul)}
.btn.block{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.45}

/* cuentas */
.bills{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.bill{background:var(--surface);border:0;border-radius:var(--r-md);padding:26px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0;position:relative}
.bill .ic{width:48px;height:48px;display:grid;place-items:center;color:var(--azul)}
.bill .txt{display:flex;flex-direction:column;gap:1px;align-items:center;max-width:100%;min-width:0}
.bill .n{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bill .m{font-size:12.5px;color:var(--muted);line-height:1.25}
.bill .q{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:-4px}
.bill .cbar{width:70%}
.bill .st{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.bill .st svg{width:12px;height:12px;stroke-width:3}
.bill .due{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.bill .due.late{color:#fff;background:var(--danger)}
.bill .cd{position:absolute;top:6px;right:6px;width:30px;height:30px}
.bill .cd svg{width:100%;height:100%;transform:rotate(-90deg)}
.bill .cd b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.bill.paid .ic{opacity:.55}
.bill.add{border:1.5px dashed var(--line);background:transparent;color:var(--azul);justify-content:center;align-items:center;min-height:118px;padding:12px 8px}

/* lista */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:14px;background:var(--azul-soft);color:var(--azul);display:grid;place-items:center;flex:none;position:relative}
.item .ic.cel{background:var(--celeste-soft);color:var(--celeste)}
.item .ic.ok{background:var(--ok-soft);color:var(--ok)}
.item .ic .av.sm{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;font-size:9px;border:2px solid var(--bg)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{display:block;color:var(--muted);font-size:12.5px}
.item .v{text-align:right;flex:none}
.item .v b{display:block;font-weight:700;font-size:15px}
.item .v small{display:block;font-size:12px;font-weight:600}
.item.mov{gap:4px}
.item-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;border:0;background:none;text-align:left;color:inherit;font:inherit}
.item .v small.porpagar{color:var(--muted)}
.chk{width:40px;height:40px;flex:none;display:grid;place-items:center;padding:0;border:0;background:none;margin-right:-6px}
.chk svg{width:26px;height:26px;padding:4px;box-sizing:border-box;border-radius:50%;border:2px solid var(--muted);color:transparent}
.chk.on svg{background:var(--ok);border-color:var(--ok);color:#fff}
.pos{color:var(--ok)} .neg{color:var(--danger)} .mut{color:var(--muted)}
.month{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 2px 2px}
.empty{color:var(--muted);text-align:center;padding:22px 12px;font-size:14px;border:1.5px dashed var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty svg{color:var(--celeste);width:28px;height:28px}

/* privado */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .card{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sum .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.sum .val{font-size:21px;font-weight:800;letter-spacing:-.02em}
.sum .wide{grid-column:1/-1;background:var(--azul-soft)}
.sum .wide .val{font-size:30px;color:var(--azul)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--azul),var(--celeste))}
.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center}
.cat .ic{grid-row:span 2;width:34px;height:34px;border-radius:11px;background:var(--bg);color:var(--azul);display:grid;place-items:center}
.cat .ic svg{width:18px;height:18px}
.cat .n{font-weight:600;font-size:14px}
.cat .a{font-weight:700;font-size:14px}
.cat .bar{grid-column:2/4}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:999px;padding:4px}
.monthnav button{background:none;border:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--azul)}
.monthnav b{font-weight:700;text-transform:capitalize}

/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.tab{background:none;border:0;border-radius:14px;padding:13px 2px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:clamp(14px,4vw,15px);font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--azul);background:var(--azul-soft)}
.fab{position:fixed;z-index:21;left:50%;margin-left:-28px;bottom:calc(4px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:20px;border:0;background:var(--azul);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(30,91,255,.38)}
.fab svg{width:28px;height:28px;stroke-width:2.2}
.fab:active{transform:scale(.96)}

/* sheet */
.backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--sheet);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:16px}

.sheet:has(>.sheet-pie){padding-bottom:0}
.sheet-pie{position:sticky;bottom:0;z-index:1;margin:0 -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--line);display:flex;gap:8px}

.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:6px 0}

let SB=null;
// Guarda los "documentos" de la app en la tabla docs. Las colecciones privadas llevan prefijo p: y dueño.
function sbDb(sb, uid){
  const watchers=[];
  async function fetchCol(w){
    let q=sb.from('docs').select('id,data').eq('col',w.col);
    q = w.owner ? q.eq('owner',w.owner) : q.is('owner',null);
    const {data,error}=await q;
    if(error){ w.err && w.err({code:'unavailable',message:error.message}); return; }
    w.cb(data||[]);
  }
  const refresh = col => watchers.filter(w=>!col||w.col===col).forEach(fetchCol);
  sb.channel('docs-cambios').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{ refresh((p.new&&p.new.col)||(p.old&&p.old.col)||null); }).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh(null); });
  const colRef=(col,owner)=>({
    onSnapshot(cb,err){ const w={col,owner,cb:rows=>cb({docs:rows.map(r=>({id:r.id,data:()=>r.data}))}),err}; watchers.push(w); fetchCol(w); return ()=>{}; },
    doc(id){ return {
      async set(data){ const {error}=await sb.from('docs').upsert({col,id,data,owner:owner||null,updated_at:new Date().toISOString()},{onConflict:'col,id'}); if(error) throw {code:'invalid_argument',message:error.message}; refresh(col); },
      async delete(){ let q=sb.from('docs').delete().eq('col',col).eq('id',id); q = owner?q.eq('owner',owner):q.is('owner',null); const {error}=await q; if(error) throw {code:'invalid_argument',message:error.message}; refresh(col); }
    }; }
  });
  const meta={ onSnapshot(cb,err){ return colRef('config',null).onSnapshot(s=>{ const d=s.docs.find(x=>x.id==='meta'); cb({exists:!!d,data:()=>d&&d.data()}); },err); },
               set(data){ return colRef('config',null).doc('meta').set(data); } };
  const privado={ collection:c=>colRef('p:'+c, uid) };
  return { collection:c=>colRef(c,null), doc:p=> p==='config/meta' ? meta : privado };
}

async function arrancar(user){
  S.user=user; S.me=user.id; S.mode='loading'; render();
  const {data:miembros}=await SB.from('miembros').select('user_id,usuario,rol');
  const yo=(miembros||[]).find(r=>r.user_id===user.id);
  if(!yo){ S.mode='sinacceso'; render(); return; }
  S.soyDueno = yo.rol==='gato';
  S.miUsuario = yo.usuario; S.hayOtro = (miembros||[]).some(r=>r!==yo);
  db=sbDb(SB,user.id); priv=db.doc('data/users/'+user.id+'/privado');
  const timer=setTimeout(()=>{ if(S.mode==='loading'){ S.err='No pudimos conectar con tus datos. Revisa tu conexión y vuelve a abrir la app.'; render(); } },10000);
  const got=new Set(), need=9;
  const done=k=>{ got.add(k); if(got.size>=need && S.mode==='loading'){ clearTimeout(timer); S.mode='live'; } render(); };
  const onErr=e=>{ S.err='Se perdió la conexión con los datos. Revisa tu internet.'; render(); };
  const list=snap=>snap.docs.map(x=>({id:x.id,...x.data()}));
  db.collection('perfiles').onSnapshot(s=>{ S.perfiles=Object.fromEntries(s.docs.map(x=>[x.id,x.data()])); done('p'); }, onErr);
  db.collection('gastos').onSnapshot(s=>{ S.gastos=list(s); done('g'); }, onErr);
  db.collection('cuentas').onSnapshot(s=>{ S.cuentas=list(s); done('c'); }, onErr);
  db.collection('aportes').onSnapshot(s=>{ S.aportes=list(s); done('a'); }, onErr);
  db.doc('config/meta').onSnapshot(s=>{ S.meta=s.exists?s.data():null; done('m'); }, onErr);
  priv.collection('movs').onSnapshot(s=>{ S.movs=list(s); done('v'); }, onErr);
  priv.collection('fijos').onSnapshot(s=>{ S.fijos=list(s); done('f'); }, onErr);
  db.collection('deseos').onSnapshot(s=>{ S.deseos=list(s); done('d'); }, onErr);
  priv.collection('deseos').onSnapshot(s=>{ S.misDeseos=list(s); done('e'); }, onErr);
  if(!(user.user_metadata||{}).tiene_clave) setTimeout(()=>openNuevaClave('primera'),1200);
}

function traducirError(e){ const m=(e&&e.message||'').toLowerCase();
  if(e&&e.propio) return e.message;
  if(m.includes('invalid login')) return 'Correo o clave incorrectos.';
  if(m.includes('email not confirmed')) return 'Primero confirma tu cuenta con el enlace que te llegó por correo.';
  if(m.includes('database error')||m.includes('no tiene acceso')) return 'Este correo no tiene acceso a Gato Gastos.';
  if(m.includes('already registered')) return 'Ese correo ya tiene cuenta. Entra con tu clave o usa “¿Olvidaste tu clave?”.';
  if(m.includes('rate limit')||m.includes('security purposes')) return 'Se enviaron demasiados correos. Espera unos minutos e inténtalo de nuevo.';
  if(m.includes('should be different')) return 'La clave nueva debe ser distinta a la anterior.';
  if(m.includes('password')) return 'La clave debe tener al menos 6 caracteres.';
  return 'No se pudo completar: '+(e&&e.message||'error desconocido');
}

function bindAuth(){
  const f=$('#auth-f'); if(!f) return;
  const cambiar=v=>{ S.authEmail=$('#a-email').value; S.authModo=v; S.authMsg=''; S.olvidoPaso=0; render(); };
  f.querySelectorAll('#a-modo button').forEach(b=>b.onclick=()=>cambiar(b.dataset.v));
  f.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>cambiar(b.dataset.am));
  f.onsubmit=async e=>{ e.preventDefault();
    const email=$('#a-email').value.trim().toLowerCase(), pass=($('#a-pass')||{}).value||'', m=S.authModo||'entrar'; S.authEmail=email;
    if(!email) return toast('Escribe tu usuario');
    const conCodigo=m==='crear'||(m==='olvido'&&S.olvidoPaso);
    const codigo=conCodigo?$('#a-cod').value.trim():'';
    if(conCodigo && !codigo) return toast('Escribe tu código');
    if((m!=='olvido'||S.olvidoPaso) && pass.length<6) return toast('La clave debe tener al menos 6 caracteres');
    $('#a-ok').disabled=true;
    try{
      if(m==='entrar'){ let user;
        if(email.includes('@')){ const {data,error}=await SB.auth.signInWithPassword({email,password:pass}); if(error) throw error; user=data.user; }
        else user=await acceso({accion:'entrar',usuario:email,clave:pass});
        S.authMsg=''; await arrancar(user); return; }
      if(m==='crear'){ const user=await acceso({accion:'crear',usuario:email,clave:pass,codigo}); S.authMsg=''; await arrancar(user); return; }
      if(m==='olvido'&&S.olvidoPaso){ const user=await acceso({accion:'restablecer',usuario:email,clave:pass,codigo}); S.authMsg=''; S.olvidoPaso=0; await arrancar(user); return; }
      if(m==='olvido'){ await accesoPost({accion:'pedir_codigo',usuario:email}); S.authMsg=''; S.olvidoPaso=1; }
    }catch(err){ S.authMsg=traducirError(err); }
    render();
  };

/* ---------- cálculos ---------- */
function pozo(){ return S.aportes.reduce((s,a)=>s+(a.tipo==='retiro'?-a.monto:a.monto),0); }
function personas(){
  const ids=Object.keys(S.perfiles).sort((a,b)=>(S.perfiles[a].creado||0)-(S.perfiles[b].creado||0));
  const yo=S.me, real=ids.find(i=>i!==yo) || null;
  // 'pareja' = la otra persona, aunque aún no haya creado su perfil
  return {yo, otro: real || 'pareja', real};
}
function otroDe(id){ return Object.keys(S.perfiles).find(i=>i!==id) || 'pareja'; }
const res = (id, creador) => (id==='pareja' && creador) ? otroDe(creador) : id;
function normalizar(){
  S.gastos=S.gastos.map(g=>g.pagadoPor==='pareja'?{...g,pagadoPor:res(g.pagadoPor,g.creadoPor)}:g);
  S.aportes=S.aportes.map(a=>a.uid==='pareja'?{...a,uid:res(a.uid,a.creadoPor)}:a);
  S.cuentas=S.cuentas.map(c=>{ const ps=c.pagos||{}; if(!Object.values(ps).some(p=>p&&p.uid==='pareja')) return c;
    const n={}; for(const k in ps) n[k]=ps[k].uid==='pareja'?{...ps[k],uid:res('pareja',ps[k].creadoPor)}:ps[k]; return {...c,pagos:n}; });
}
// El dueño de la app es "el gato"; su pareja, "la gata".
const gatoId = () => S.soyDueno ? S.me : personas().otro;
const esGato = id => id===gatoId();
const apodo = id => esGato(id) ? 'Gato' : 'Gata';
const art = id => esGato(id) ? 'el gato' : 'la gata';
const deA = id => esGato(id) ? 'del gato' : 'de la gata';
const aA = id => esGato(id) ? 'al gato' : 'a la gata';

function avInner(id){ const p=S.perfiles[id]||{}; return p.foto?`<img src="${esc(p.foto)}" alt="">`:`<img class="av-gato" src="${IMG.mascota}" alt="">`; }
function avatar(id, cls=''){
  const p=S.perfiles[id]||{}; const b = id && id!==S.me ? ' b' : '';
  return `<span class="av ${cls}${b}">${avInner(id)}</span>`;
}
// cuánto le acredita un movimiento a quien pagó
function credito(g){ return (g.tipo==='pago'||g.tipo==='perdon') ? g.monto : (g.reparto==='otro' ? g.monto : g.monto/2); }
function balance(){
  // >0: el otro me debe a mí
  let n=0; for(const g of S.gastos){ n += (g.pagadoPor===S.me?1:-1)*credito(g); } return Math.round(n);
}
// Plata que de verdad salió (o volvió) de mi bolsillo por la casa: lo que pagué completo, menos lo que me devolvieron.
function miCaja(g){ if(g.tipo==='perdon') return 0; if(g.tipo==='pago') return g.pagadoPor===S.me?g.monto:-g.monto; return g.pagadoPor===S.me?g.monto:0; }
function miParte(g){ if(g.tipo==='pago'||g.tipo==='perdon') return 0; if(g.reparto==='otro') return g.pagadoPor===S.me?0:g.monto; return g.monto/2; }

  }

    const deudor = b>0 ? otro : S.me, acreedor = b>0 ? S.me : otro;

    h+=`<section class="bal" aria-label="Balance">
      <div class="bal-l"><div class="who">${txt}</div>
      <div class="amt num">${b===0?'$0':fmt(b)}</div>
      ${b===0?'<div class="sub">Nada pendiente entre ustedes.</div>':''}

  h+=metaCard();

  // cuentas del mes
  const m=ym(today());
  const cs=[...S.cuentas].filter(c=>!terminada(c,m)).sort((a,b)=>(a.dia||99)-(b.dia||99));

    <div class="bills">${cs.map(c=>{ const p=c.pagos&&c.pagos[m]; const q=c.frecuencia==='cuotas'; const n=cuotasPagadas(c);
      const due=vence(c,m), dd=due?diasHasta(due):null;
      let corner='';
      if (p) corner=`<span class="st">${ic('check')}</span>`;
      else if (due && dd<0) corner=`<span class="due late">Vencida</span>`;
      else if (due && dd<=10) corner=countdown(dd);
      else if (due) corner=`<span class="due">${due.getDate()} ${MES[due.getMonth()].slice(0,3)}</span>`;
      const sub = p ? `Pagó ${esc(nombre(p.uid))}` : (c.monto?fmt(c.monto):'');
      return `<button class="bill${p?' paid':''}" data-act="cuenta" data-id="${esc(c.id)}">
      ${corner}<span class="ic">${ic(c.icono)}</span><span class="txt"><span class="n">${esc(c.nombre)}</span><span class="m num">${sub}</span></span>
      ${q?`<span class="q num">Cuota ${p?n:n+1} de ${c.cuotas}</span><span class="cbar"><i style="width:${Math.min(100,n/c.cuotas*100)}%"></i></span>`:''}</button>`; }).join('')}
      <button class="bill add" data-act="nuevaCuenta">${ic('plus')}<span class="n" style="font-size:13px">Agregar</span></button></div>
    ${fin?`<button class="link sm" data-act="terminadas">${ic('check')}${fin} ${fin===1?'cuenta en cuotas terminada':'cuentas en cuotas terminadas'}</button>`:''}</section>`;
  // Vicente
  const vg=S.gastos.filter(g=>g.icono==='vicente' && g.tipo!=='pago' && g.tipo!=='perdon' && ym(g.fecha)===m);
  if (vg.length){ const vt=vg.reduce((s,g)=>s+g.monto,0);

  // movimientos

        <span class="t"><b>${esc(g.desc)}</b><small>${g.tipo==='perdon'?'Diferencia en cero':(mine?'Pagaste tú':'Pagó '+esc(nombre(g.pagadoPor)))} · ${fecha(g.fecha)}${g.reparto==='otro'&&g.tipo!=='pago'?' · 100% del otro':''}</small></span>
        <span class="v num"><b>${fmt(g.monto)}</b><small class="${cls}">${sub}</small></span></button>`; }
    h+=`</div>`; if(gs.length>12) h+=`<button class="link" data-act="verTodo">${S.verTodo?'Ver menos':`Ver los ${gs.length} movimientos`}</button>`; }
  h+=`</section>`;
  return h;
}

const RING={val:0,meta:0,raf:0,intro:true,pozo:0};
function ringsSvg(v,pct){
  RING.meta=v||0; RING.pozo=pozo();
  const r=60, L=2*Math.PI*r, off=L*(1-Math.min(1,Math.max(0,RING.val)));
  return `<div class="rings" role="img" aria-label="Avance de la meta ${pct||0}%"><svg viewBox="0 0 150 150"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--azul)"/><stop offset="1" stop-color="var(--celeste)"/></linearGradient></defs>
    <circle class="ring-t1" cx="75" cy="75" r="${r}" stroke-width="20"/><circle class="ring-v" cx="75" cy="75" r="${r}" stroke="url(#rg)" stroke-width="20" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="c"><div class="cc"><img class="pie-casa" src="${CASA_PIE}" alt=""><div class="pct num">${Math.round(RING.val*100)}%</div></div></div></div>`;
}
function pintarRing(){
  const c=$('.ring-v'); if(!c) return;
  const L=2*Math.PI*60; c.setAttribute('stroke-dashoffset',(L*(1-Math.min(1,Math.max(0,RING.val)))).toFixed(1));
  $('.rings .pct').textContent=Math.round(RING.val*100)+'%';
  if(RING.intro && RING.meta) $('.meta-info .big').textContent=fmtM(RING.pozo*RING.val/RING.meta);
}
// Solo se anima si cambia el valor: la primera vez lento y con fanfarria, después un ajuste corto. Se pinta cuadro a cuadro para sobrevivir a los render().
function animRings(){
  if(!$('.ring-v') || RING.raf || RING.val===RING.meta) return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ RING.val=RING.meta; RING.intro=false; pintarRing(); return; }
  const de=RING.val, t0=performance.now(), dur=RING.intro?2800:900;
  const paso=now=>{ const p=Math.min(1,(now-t0)/dur), e=p<.5?4*p*p*p:1-Math.pow(2-2*p,3)/2;
    RING.val=de+(RING.meta-de)*e; pintarRing();
    if(p<1){ RING.raf=requestAnimationFrame(paso); return; }
    RING.val=RING.meta; RING.raf=0; pintarRing();
    if(RING.intro){ RING.intro=false; fanfarria(); } else animRings(); };
  RING.raf=requestAnimationFrame(paso);
}
function fanfarria(){
  const r=$('.rings'); if(!r) return;
  r.classList.add('fanfarria');
  const b=r.getBoundingClientRect(), capa=document.createElement('div'), cols=['var(--azul)','var(--celeste)','var(--ok)','#FFC53D'];
  capa.className='fanfarria-capa'; capa.setAttribute('aria-hidden','true'); capa.style.left=(b.left+b.width/2)+'px'; capa.style.top=(b.top+b.height/2)+'px';
  let h='<i class="onda"></i>';
  for(let i=0;i<22;i++) h+=`<i class="chispa${i%3?'':' r'}" style="--a:${Math.round(i*360/22+Math.random()*12)}deg;--d:${Math.round(95+Math.random()*55)}px;--g:${Math.round(Math.random()*360)}deg;--s:${5+i%4}px;--c:${cols[i%4]};--t:${Math.round(Math.random()*120)}ms"></i>`;
  capa.innerHTML=h; document.body.appendChild(capa);
  setTimeout(()=>capa.remove(),1600);
}

function mio(){
  const k=S.mesPriv;
  const ms=[...S.movs.filter(m=>ym(m.fecha)===k), ...fijosDelMes(k)].sort((a,b)=>(a.tipo==='ingreso'?0:1)-(b.tipo==='ingreso'?0:1) || b.fecha.localeCompare(a.fecha));
  const ing=ms.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+m.monto,0);
  const gas=ms.filter(m=>m.tipo!=='ingreso'&&m.pagado!==false).reduce((s,m)=>s+m.monto,0);
  const porPagar=ms.filter(m=>m.tipo!=='ingreso'&&m.pagado===false).reduce((s,m)=>s+m.monto,0);
  const gastosMes=S.gastos.filter(g=>ym(g.fecha)===k);
  const casaMes=gastosMes.reduce((s,g)=>s+miCaja(g),0), parteMes=gastosMes.reduce((s,g)=>s+miParte(g),0);
  const aporteMes=S.aportes.filter(a=>a.uid===S.me && a.tipo!=='ajuste' && ym(a.fecha)===k).reduce((s,a)=>s+(a.tipo==='retiro'?-a.monto:a.monto),0);
  const disp=ing-gas-casaMes-aporteMes;
  let h=`<div class="monthnav"><button data-act="mes" data-d="-1" aria-label="Mes anterior">${ic('left')}</button><b>${mesLabel(k)}</b><button data-act="mes" data-d="1" aria-label="Mes siguiente">${ic('right')}</button></div>
  <div class="banner">${ic('lock')}<span>Solo tú ves esta sección. Tu pareja no tiene acceso a estos datos.</span></div>
  <div class="sum num">
    <div class="card wide"><span class="lbl">Disponible este mes</span><span class="val">${disp<0?'−':''}${fmt(disp)}</span><span class="lbl" style="font-weight:500">Ingresos − gastos pagados − pagado en la casa − aporte al pie</span></div>
    <div class="card"><span class="lbl">Ingresos</span><span class="val pos">${fmt(ing)}</span></div>
    <div class="card"><span class="lbl">Gastos pagados</span><span class="val">${fmt(gas)}</span>${porPagar?`<span class="lbl" style="font-weight:500">Por pagar: ${fmt(porPagar)}</span>`:''}</div>
    <div class="card"><span class="lbl">Pagado en la casa</span><span class="val">${casaMes<0?'−':''}${fmt(casaMes)}</span>${parteMes?`<span class="lbl" style="font-weight:500">Tu parte: ${fmt(parteMes)}</span>`:''}</div>
    <div class="card"><span class="lbl">Aporte al pie</span><span class="val" style="color:var(--azul)">${aporteMes<0?'−':''}${fmt(aporteMes)}</span></div>
  </div>`;
  // categorías
  const cat={}; ms.filter(m=>m.tipo!=='ingreso'&&m.pagado!==false).forEach(m=>cat[m.icono]=(cat[m.icono]||0)+m.monto);
  gastosMes.filter(g=>miCaja(g)>0).forEach(g=>cat[g.icono]=(cat[g.icono]||0)+miCaja(g));
  const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,5); const max=top[0]?top[0][1]:1;
  if (top.length) h+=`<section class="card sec"><h2>En qué se va</h2><div class="cats num">${top.map(([c,v])=>`<div class="cat"><span class="ic">${ic(c)}</span><span class="n">${esc(CAT[c]||'Otro')}</span><span class="a">${fmt(v)}</span><div class="bar"><i style="width:${Math.max(4,v/max*100)}%"></i></div></div>`).join('')}</div></section>`;
  h+=deseosSec('mio');
  h+=`<section class="sec"><h2>Mis movimientos</h2>`;
  if(!ms.length) h+=`<div class="empty">${ic('tarjeta')}<b>Sin movimientos en ${MES[+k.slice(5)-1]}</b>Toca + para anotar tu sueldo, la tarjeta de crédito o cualquier gasto personal.</div>`;
  else h+=`<div class="list">${ms.map(m=>{ const cuerpo=`<span class="ic${m.tipo==='ingreso'?' ok':' cel'}">${ic(m.icono)}</span>
    <span class="t"><b>${esc(m.desc)}</b><small>${m.fijo?(m.cada===3?'Cada 3 meses':'Fijo mensual'):esc(CAT[m.icono]||'Otro')} · ${fecha(m.fecha)}</small></span>
    <span class="v num"><b class="${m.tipo==='ingreso'?'pos':''}">${m.tipo==='ingreso'?'+':'−'}${fmt(m.monto)}</b>${m.tipo!=='ingreso'&&m.pagado===false?'<small class="porpagar">Por pagar</small>':''}</span>`;
    if(m.tipo==='ingreso') return `<button class="item" data-act="verMov" data-id="${esc(m.id)}">${cuerpo}</button>`;
    const on=m.pagado!==false;
    return `<div class="item mov"><button class="item-main" data-act="verMov" data-id="${esc(m.id)}">${cuerpo}</button><button class="chk${on?' on':''}" data-act="pagoMov" data-id="${esc(m.id)}" aria-pressed="${on}" aria-label="${on?'Pagado. Tocar para dejar por pagar':'Marcar como pagado'}">${ic('check')}</button></div>`; }).join('')}</div>`;
  return h+`</section>`;
}

function countdown(d){
  const r=12, L=2*Math.PI*r, f=Math.max(0,Math.min(1,d/10)), hue=Math.round(Math.max(0,d-1)/9*48);

    <circle cx="15" cy="15" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L*(1-f)).toFixed(1)}"/></svg><b style="color:${col}">${d===0?'!':d}</b></span>`;
}

    ${linkOk?`<a class="btn block soft" href="${esc(pi.link)}" target="_blank" rel="noopener">${ic('link')}Ir al portal de pago</a>`:''}</div>`; }
function copiar(txt, btn){
  const ok=()=>{ toast('Copiado'); if(btn){ btn.classList.add('ok'); setTimeout(()=>btn.classList.remove('ok'),1200); } };
  const fallback=()=>{ const t=document.createElement('textarea'); t.value=txt; t.setAttribute('readonly',''); t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); let r=false; try{ r=document.execCommand('copy'); }catch(e){} t.remove(); r?ok():toast('Mantén presionado el texto para copiarlo'); };
  try{ navigator.clipboard.writeText(txt).then(ok,fallback); }catch(e){ fallback(); }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(b){ copiar(b.dataset.copy,b); return; }

}

function deseosSec(sc){
  const all=S[colDeseos(sc)], ws=all.filter(w=>!w.comprado).sort((a,b)=>(a.prioridad==='pronto'?0:1)-(b.prioridad==='pronto'?0:1)||(a.creado||0)-(b.creado||0));
  const hechos=all.length-ws.length, tot=ws.reduce((s,w)=>s+(w.monto||0),0);
  const open=OPEN[sc]===true;
  let h=`<section class="sec"><button class="fold" data-act="fold" data-s="${sc}" aria-expanded="${open}"><span class="fold-ic">${ic('sueno')}</span><span class="fold-t">${sc==='casa'?'Deseos de hogar':'Mis deseos'}<small class="num">${ws.length?`${ws.length} ${ws.length===1?'deseo':'deseos'} · ${fmt(tot)}`:'Aún no hay deseos'}</small></span><span class="fold-r">${ic(open?'up':'down2')}</span></button>`;
  if(!open) return h+`</section>`;
  h+=`<div class="wishbox">`;
  if(!ws.length) h+=`<div class="empty" style="border:0">${ic('sueno')}<b>${sc==='casa'?'¿Qué quieren comprar?':'¿Qué te quieres comprar?'}</b>${sc==='casa'?'Anoten las cosas que sueñan para la casa o para Pipo. Cuando las compren, se registran como gasto común.':'Solo tú ves esta lista. Cuando lo compres, se anota como gasto personal.'}</div>`;

      <span class="v num"><b>${w.monto?fmt(w.monto):'—'}</b></span></button>`).join('')}</div>`;
  h+=`<div class="wish-foot"><button class="link" data-act="nuevoDeseo" data-s="${sc}">+ Agregar deseo</button>${hechos?`<button class="link sm" data-act="cumplidos" data-s="${sc}">${ic('check')}${hechos} ${hechos===1?'cumplido':'cumplidos'}</button>`:''}</div></div></section>`;

function openCumplidos(sc){
  const ws=S[colDeseos(sc)].filter(w=>w.comprado).sort((a,b)=>String(b.compradoEl).localeCompare(String(a.compradoEl)));
  openSheet(head('Deseos cumplidos')+`<div class="list">${ws.map(w=>`<div class="item"><span class="ic ok">${ic(w.icono)}</span><span class="t"><b>${esc(w.nombre)}</b><small>${w.compradoEl?fecha(w.compradoEl)+' '+w.compradoEl.slice(0,4):''}</small></span>
    <span class="v num"><b>${fmt(w.montoFinal||w.monto||0)}</b><small><button class="link" style="font-size:12px;padding:0" data-delw="${esc(w.id)}">Quitar</button></small></span></div>`).join('')}</div>`,
    sh=>sh.querySelectorAll('[data-delw]').forEach(b=>b.onclick=async()=>{ if(!b.dataset.c){ b.dataset.c=1; b.textContent='¿Seguro?'; return; } await safe(()=>borrar(colDeseos(sc),b.dataset.delw),'Quitado'); closeSheet(); }));
}

function openPerfil(first){
  const p=S.perfiles[S.me]||{}; let foto=p.foto||'';
  openSheet(head(first?'Crea tu perfil':'Mi perfil')+`<div class="photo"><label for="f-foto"><span class="av lg" id="f-prev">${foto?`<img src="${esc(foto)}" alt="">`:ic('yo')}</span><span class="cam">${ic('cam')}</span></label>
      <input type="file" accept="image/*" id="f-foto" class="sr"><span class="hint">Toca para elegir una foto</span></div>
    <div class="field"><label for="f-nombre">Tu nombre</label><input class="inp" id="f-nombre" maxlength="24" placeholder="¿Cómo te llamas?" value="${esc(p.nombre||'')}"></div>
    <button class="btn block" id="f-ok">${first?'Empezar':'Guardar'}</button>
    ${!first && SB ? `<div class="detail" style="gap:4px"><div><span>Tu usuario</span><b>${esc(S.miUsuario||'')}</b></div></div>
      ${S.soyDueno && !S.hayOtro ? `<button class="btn block soft" data-act="invitar">Invitar ${aA(personas().otro)}</button>`:''}
      <div class="row2"><button class="btn soft" data-act="clave">Cambiar clave</button><button class="btn danger" data-act="salir">Cerrar sesión</button></div>`:''}`, sh=>{
      sh.querySelector('#f-foto').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); const url=URL.createObjectURL(f);
        img.onload=()=>{ const s=240, cv=document.createElement('canvas'); cv.width=cv.height=s; const k=Math.min(img.width,img.height);
          cv.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,s,s); foto=cv.toDataURL('image/jpeg',.82); URL.revokeObjectURL(url);
          sh.querySelector('#f-prev').innerHTML=`<img src="${foto}" alt="">`; };
        img.onerror=()=>toast('No se pudo leer la imagen'); img.src=url; };
      sh.querySelector('#f-ok').onclick=async()=>{ const nombre=sh.querySelector('#f-nombre').value.trim(); if(!nombre) return toast('Escribe tu nombre');
        if(await safe(()=>guardarPerfil({nombre,foto,creado:p.creado||Date.now()}),'Perfil guardado')) closeSheet(); };
    });
}

/* ---------- eventos ---------- */
document.addEventListener('click', e=>{
  if (e.target.closest('[data-close]')) return closeSheet();
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  ({salir:salir, invitar:()=>{ closeSheet(); setTimeout(invitar,280); }, clave:()=>{ closeSheet(); setTimeout(()=>openNuevaClave('cambiar'),280); }, masPozo:()=>{ S.masPozo=!S.masPozo; render(); }, fold:()=>toggleFold(t.dataset.s), deseo:()=>openDeseo(t.dataset.s,id), nuevoDeseo:()=>editDeseo(t.dataset.s,null), cumplidos:()=>openCumplidos(t.dataset.s),
    perfil:()=>openPerfil(false), saldar:openSaldar, perdonar:openPerdonar, retirar:()=>{ S.masPozo=false; render(); openRetirar(); }, terminadas:openTerminadas,
    editarCuenta:()=>{ const c=S.cuentas.find(x=>x.id===id); closeSheet(); setTimeout(()=>editCuenta(c),280); }, meta:()=>{ S.masPozo=false; render(); openMeta(); }, aportar:()=>S.meta?openAportar():openMeta(), verAportes:()=>{ S.masPozo=false; render(); openAportes(); },
    cuenta:()=>openCuenta(id), nuevaCuenta:()=>editCuenta(null), verGasto:()=>openVerGasto(id), verMov:()=>openVerMov(id), pagoMov:()=>togglePagoMov(id),
    verTodo:()=>{S.verTodo=!S.verTodo;render();},
    mes:()=>{ const [y,m]=S.mesPriv.split('-').map(Number); const d=new Date(y,m-1+Number(t.dataset.d),1); S.mesPriv=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); render(); }
  }[a]||(()=>{}))();
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; location.hash=S.tab; window.scrollTo(0,0); render(); });
$('#fab').onclick=()=> S.tab==='casa'?openGasto():openMov();
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h==='casa'||h==='mio'){ S.tab=h; render(); } });
{ const h=location.hash.slice(1); if(h==='mio') S.tab='mio'; }
init();
</script>

</body>
